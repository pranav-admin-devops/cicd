apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cicd
  template:
    metadata:
      labels:
        app: cicd
    spec:
      containers:
      - name: cicd
        image: $IMAGE_NAME:$IMAGE_TAG
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: cicd-service
spec:
  type: NodePort
  selector:
    app: cicd
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
